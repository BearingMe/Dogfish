<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="640" cy="320" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162032" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0a0f18" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="gold-radial" cx="300" cy="280" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyan-radial" cx="980" cy="360" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .title-cinzel { font-family: 'Cinzel', Georgia, serif; }
    .text-inter { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="#06090e"/>
  <rect width="1280" height="640" fill="url(#bg-glow)"/>
  <rect width="1280" height="640" fill="url(#gold-radial)"/>
  <rect width="1280" height="640" fill="url(#cyan-radial)"/>

  <!-- Blueprint / Tactical Grid -->
  <rect width="1280" height="640" fill="url(#grid-pattern)"/>

  <!-- Outer Precision Frame -->
  <rect x="24" y="24" width="1232" height="592" rx="14" fill="none" stroke="url(#card-border-grad)" stroke-width="1.5"/>
  <rect x="32" y="32" width="1216" height="576" rx="10" fill="none" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Corner Crosshairs / Tactical Markers -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7">
    <path d="M 40 48 L 40 40 L 48 40"/>
    <path d="M 1240 48 L 1240 40 L 1232 40"/>
    <path d="M 40 592 L 40 600 L 48 600"/>
    <path d="M 1240 592 L 1240 600 L 1232 600"/>
  </g>

  <!-- Tactical Compass / Astrolabe Geometry on the Right -->
  <g transform="translate(980, 320)" opacity="0.35">
    <circle r="220" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 6"/>
    <circle r="180" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle r="140" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
    <circle r="90" fill="none" stroke="#334155" stroke-width="1"/>
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle r="4" fill="#f59e0b"/>

    <line x1="-240" y1="0" x2="240" y2="0" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>
    <line x1="-160" y1="-160" x2="160" y2="160" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>
    <line x1="-160" y1="160" x2="160" y2="-160" stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4"/>

    <polygon points="0,-180 180,0 0,180 -180,0" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <polygon points="0,-140 140,0 0,140 -140,0" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.3"/>

    <circle cx="80" cy="-60" r="5" fill="#f59e0b" fill-opacity="0.6"/>
    <text x="92" y="-56" class="mono" font-size="10" fill="#94a3b8">HOLD_SOLITUDE</text>
    <line x1="0" y1="0" x2="80" y2="-60" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>

    <circle cx="-90" cy="70" r="5" fill="#0ea5e9" fill-opacity="0.6"/>
    <text x="-165" y="74" class="mono" font-size="10" fill="#94a3b8">HOLD_WHITERUN</text>
    <line x1="0" y1="0" x2="-90" y2="70" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>

    <circle cx="110" cy="90" r="4" fill="#38bdf8" fill-opacity="0.5"/>
    <text x="122" y="94" class="mono" font-size="10" fill="#94a3b8">HOLD_WINDHELM</text>
    <line x1="0" y1="0" x2="110" y2="90" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Content Area (Left / Center) -->
  <g transform="translate(80, 0)">

    <!-- Top Metadata Header / Repo Breadcrumb -->
    <g transform="translate(0, 110)">
      <rect x="0" y="-2" width="232" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <path d="M12 6C8.69 6 6 8.69 6 12c0 2.65 1.72 4.9 4.1 5.69.3.06.41-.13.41-.29v-1.02c-1.67.36-2.02-.8-2.02-.8-.27-.69-.67-.87-.67-.87-.55-.37.04-.37.04-.37.6.04.92.62.92.62.54.92 1.41.65 1.75.5.05-.39.21-.65.38-.8-1.33-.15-2.73-.67-2.73-2.97 0-.66.23-1.19.62-1.61-.06-.15-.27-.77.06-1.6 0 0 .5-.16 1.66.62.48-.13 1-.2 1.51-.2s1.03.07 1.51.2c1.15-.78 1.65-.62 1.65-.62.33.83.12 1.45.06 1.6.39.42.62.95.62 1.61 0 2.3-1.4 2.81-2.74 2.96.22.19.41.56.41 1.13v1.68c0 .16.11.35.42.29C16.29 16.9 18 14.65 18 12c0-3.31-2.69-6-6-6z" fill="#94a3b8" transform="translate(4, 2)"/>
      <text x="32" y="19" class="mono" font-size="13" font-weight="600" fill="#cbd5e1">BearingMe / Dogfish</text>

      <rect x="244" y="-2" width="100" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="258" cy="14" r="3.5" fill="#10b981"/>
      <text x="268" y="19" class="mono" font-size="12" font-weight="600" fill="#94a3b8">main: v0.3.9</text>
    </g>

    <!-- Main Title: DOGFISH -->
    <g transform="translate(0, 220)">
      <text x="0" y="0" class="title-cinzel" font-size="82" font-weight="900" letter-spacing="4" fill="url(#silver-grad)">
        DOGFISH
      </text>
      <rect x="4" y="16" width="380" height="4" fill="url(#gold-grad)" rx="2"/>
    </g>

    <!-- Subtitle & Focus Area -->
    <g transform="translate(0, 305)">
      <text x="0" y="0" class="text-inter" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
        Conquest of Skyrim Research
      </text>
      <text x="0" y="34" class="text-inter" font-size="18" font-weight="400" fill="#94a3b8">
        Independent specification recovery, system architecture &amp; reverse engineering
      </text>
    </g>

    <!-- Strategic Badges & Core Pillars -->
    <g transform="translate(0, 420)">
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <circle cx="22" cy="21" r="5" fill="#f59e0b"/>
        <text x="36" y="26" class="mono" font-size="13" font-weight="600" fill="#f1f5f9">32 MILESTONES</text>
      </g>

      <g transform="translate(196, 0)">
        <rect width="210" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <circle cx="22" cy="21" r="5" fill="#0ea5e9"/>
        <text x="36" y="26" class="mono" font-size="13" font-weight="600" fill="#f1f5f9">REVERSE ENGINEERING</text>
      </g>

      <g transform="translate(422, 0)">
        <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
        <circle cx="22" cy="21" r="5" fill="#a855f7"/>
        <text x="36" y="26" class="mono" font-size="13" font-weight="600" fill="#f1f5f9">CREATION ENGINE &amp; PAPYRUS</text>
      </g>
    </g>

    <!-- Bottom Technical Inscription -->
    <g transform="translate(0, 520)">
      <text x="0" y="0" class="mono" font-size="12" fill="#64748b" letter-spacing="0.5">
        SPECIFICATION RECOVERY PROGRAM // GALVATRON304 // NEXUSMODS #65628
      </text>
      <text x="0" y="20" class="mono" font-size="11" fill="#475569">
        EVIDENCE-BACKED INVARIANTS &#8226; DETERMINISTIC REPRODUCIBILITY &#8226; CONVENTIONAL COMMITS
      </text>
    </g>

  </g>
</svg>